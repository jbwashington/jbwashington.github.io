<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encoder/Decoder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-8">
    <div class="max-w-4xl mx-auto px-4">
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Base64 Encoder/Decoder</h1>
            <p class="text-gray-600">Encode and decode Base64 strings. Includes file support.</p>
            <a href="/utils/" class="text-blue-600 hover:underline text-sm">← Back to Utils</a>
        </div>

        <div class="bg-white rounded-lg shadow-sm p-6 mb-4">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Mode</label>
                <div class="flex gap-4">
                    <label class="flex items-center">
                        <input type="radio" name="mode" value="encode" checked class="mr-2" onchange="updateMode()">
                        <span class="text-gray-700">Encode</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="mode" value="decode" class="mr-2" onchange="updateMode()">
                        <span class="text-gray-700">Decode</span>
                    </label>
                </div>
            </div>

            <label for="input" class="block text-sm font-medium text-gray-700 mb-2">
                <span id="inputLabel">Text to Encode</span>
            </label>
            <textarea
                id="input"
                class="w-full h-64 p-3 border border-gray-300 rounded-md font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="Enter text here..."
            ></textarea>

            <div class="mt-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Or load from file:</label>
                <input
                    type="file"
                    id="fileInput"
                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                    onchange="handleFileUpload()"
                >
            </div>

            <div class="flex gap-2 mt-4">
                <button onclick="convert()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium">
                    <span id="convertBtn">Encode</span>
                </button>
                <button onclick="copyToClipboard()" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 font-medium">
                    Copy Output
                </button>
                <button onclick="clearAll()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 font-medium">
                    Clear
                </button>
            </div>

            <div id="error" class="mt-4 p-3 bg-red-50 border border-red-200 rounded-md text-red-700 text-sm hidden"></div>
            <div id="success" class="mt-4 p-3 bg-green-50 border border-green-200 rounded-md text-green-700 text-sm hidden"></div>
        </div>

        <div class="bg-white rounded-lg shadow-sm p-6">
            <label for="output" class="block text-sm font-medium text-gray-700 mb-2">
                <span id="outputLabel">Base64 Output</span>
            </label>
            <textarea
                id="output"
                readonly
                class="w-full h-64 p-3 border border-gray-300 rounded-md font-mono text-sm bg-gray-50"
                placeholder="Output will appear here..."
            ></textarea>

            <div class="mt-4 text-sm text-gray-600">
                <strong>Tips:</strong> Encode text or files to Base64, or decode Base64 back to text. All processing happens in your browser.
            </div>
        </div>

        <div class="mt-6 bg-white rounded-lg shadow-sm p-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-3">Recent Conversions</h2>
            <div id="history" class="space-y-2 text-sm">
                <p class="text-gray-500">No history yet</p>
            </div>
            <button onclick="clearHistory()" class="mt-4 px-3 py-1 text-sm bg-red-100 text-red-700 rounded hover:bg-red-200">
                Clear History
            </button>
        </div>
    </div>

    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        const inputLabel = document.getElementById('inputLabel');
        const outputLabel = document.getElementById('outputLabel');
        const convertBtn = document.getElementById('convertBtn');
        const historyDiv = document.getElementById('history');

        let history = JSON.parse(localStorage.getItem('base64-history') || '[]');

        function getMode() {
            return document.querySelector('input[name="mode"]:checked').value;
        }

        function updateMode() {
            const mode = getMode();
            if (mode === 'encode') {
                inputLabel.textContent = 'Text to Encode';
                outputLabel.textContent = 'Base64 Output';
                convertBtn.textContent = 'Encode';
                input.placeholder = 'Enter text here...';
            } else {
                inputLabel.textContent = 'Base64 to Decode';
                outputLabel.textContent = 'Decoded Text';
                convertBtn.textContent = 'Decode';
                input.placeholder = 'Enter Base64 string here...';
            }
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            successDiv.classList.add('hidden');
        }

        function showSuccess(message) {
            successDiv.textContent = message;
            successDiv.classList.remove('hidden');
            errorDiv.classList.add('hidden');
        }

        function hideMessages() {
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
        }

        function convert() {
            hideMessages();
            const inputText = input.value;
            const mode = getMode();

            if (!inputText) {
                showError('Please enter some text');
                return;
            }

            try {
                if (mode === 'encode') {
                    output.value = btoa(inputText);
                    showSuccess('Text encoded to Base64!');
                    addToHistory('encode', inputText.substring(0, 50), output.value.substring(0, 50));
                } else {
                    output.value = atob(inputText);
                    showSuccess('Base64 decoded to text!');
                    addToHistory('decode', inputText.substring(0, 50), output.value.substring(0, 50));
                }
            } catch (e) {
                showError(`Conversion failed: ${e.message}`);
                output.value = '';
            }
        }

        async function handleFileUpload() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const mode = getMode();
                if (mode === 'encode') {
                    const base64 = btoa(e.target.result);
                    output.value = base64;
                    input.value = `[File: ${file.name}]`;
                    showSuccess(`File encoded to Base64!`);
                    addToHistory('encode', `File: ${file.name}`, base64.substring(0, 50));
                } else {
                    input.value = e.target.result;
                }
            };
            reader.readAsText(file);
        }

        async function copyToClipboard() {
            const outputText = output.value;

            if (!outputText) {
                showError('No output to copy');
                return;
            }

            try {
                await navigator.clipboard.writeText(outputText);
                showSuccess('Copied to clipboard!');
            } catch (e) {
                showError('Failed to copy to clipboard');
            }
        }

        function clearAll() {
            input.value = '';
            output.value = '';
            document.getElementById('fileInput').value = '';
            hideMessages();
        }

        function addToHistory(mode, input, output) {
            const entry = {
                mode,
                input: input + (input.length >= 50 ? '...' : ''),
                output: output + (output.length >= 50 ? '...' : ''),
                timestamp: new Date().toISOString()
            };

            history.unshift(entry);
            history = history.slice(0, 10); // Keep only last 10
            localStorage.setItem('base64-history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyDiv.innerHTML = '<p class="text-gray-500">No history yet</p>';
                return;
            }

            historyDiv.innerHTML = history.map((entry, i) => `
                <div class="p-2 bg-gray-50 rounded border border-gray-200">
                    <div class="flex justify-between items-start mb-1">
                        <span class="font-medium ${entry.mode === 'encode' ? 'text-blue-600' : 'text-purple-600'}">
                            ${entry.mode === 'encode' ? 'Encode' : 'Decode'}
                        </span>
                        <span class="text-xs text-gray-500">${new Date(entry.timestamp).toLocaleString()}</span>
                    </div>
                    <div class="text-xs text-gray-600 font-mono break-all">
                        ${entry.input}
                    </div>
                </div>
            `).join('');
        }

        function clearHistory() {
            history = [];
            localStorage.removeItem('base64-history');
            renderHistory();
            showSuccess('History cleared');
        }

        // Load history on page load
        window.addEventListener('DOMContentLoaded', renderHistory);

        // Convert on Ctrl/Cmd + Enter
        input.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                convert();
            }
        });
    </script>
</body>
</html>
