<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter & Validator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-8">
    <div class="max-w-4xl mx-auto px-4">
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">JSON Formatter & Validator</h1>
            <p class="text-gray-600">Format, validate, and minify JSON. Data stays in your browser.</p>
            <a href="/utils/" class="text-blue-600 hover:underline text-sm">← Back to Utils</a>
        </div>

        <div class="bg-white rounded-lg shadow-sm p-6 mb-4">
            <label for="input" class="block text-sm font-medium text-gray-700 mb-2">Input JSON</label>
            <textarea
                id="input"
                class="w-full h-64 p-3 border border-gray-300 rounded-md font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder='Paste JSON here... e.g. {"name":"value"}'
            ></textarea>

            <div class="flex gap-2 mt-4">
                <button onclick="formatJSON()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium">
                    Format
                </button>
                <button onclick="minifyJSON()" class="px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 font-medium">
                    Minify
                </button>
                <button onclick="copyToClipboard()" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 font-medium">
                    Copy Output
                </button>
                <button onclick="clearAll()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 font-medium">
                    Clear
                </button>
            </div>

            <div id="error" class="mt-4 p-3 bg-red-50 border border-red-200 rounded-md text-red-700 text-sm hidden"></div>
            <div id="success" class="mt-4 p-3 bg-green-50 border border-green-200 rounded-md text-green-700 text-sm hidden"></div>
        </div>

        <div class="bg-white rounded-lg shadow-sm p-6">
            <label for="output" class="block text-sm font-medium text-gray-700 mb-2">Output</label>
            <textarea
                id="output"
                readonly
                class="w-full h-64 p-3 border border-gray-300 rounded-md font-mono text-sm bg-gray-50"
                placeholder="Formatted JSON will appear here..."
            ></textarea>

            <div class="mt-4 text-sm text-gray-600">
                <strong>Tips:</strong> Paste JSON and click Format to prettify. Click Minify to compress. All processing happens in your browser.
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');

        // Load from localStorage on page load
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('json-formatter-input');
            if (saved) {
                input.value = saved;
            }
        });

        // Save to localStorage on input
        input.addEventListener('input', () => {
            localStorage.setItem('json-formatter-input', input.value);
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            successDiv.classList.add('hidden');
        }

        function showSuccess(message) {
            successDiv.textContent = message;
            successDiv.classList.remove('hidden');
            errorDiv.classList.add('hidden');
        }

        function hideMessages() {
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
        }

        function formatJSON() {
            hideMessages();
            const inputText = input.value.trim();

            if (!inputText) {
                showError('Please enter some JSON to format');
                return;
            }

            try {
                const parsed = JSON.parse(inputText);
                output.value = JSON.stringify(parsed, null, 2);
                showSuccess('JSON formatted successfully!');
            } catch (e) {
                showError(`Invalid JSON: ${e.message}`);
                output.value = '';
            }
        }

        function minifyJSON() {
            hideMessages();
            const inputText = input.value.trim();

            if (!inputText) {
                showError('Please enter some JSON to minify');
                return;
            }

            try {
                const parsed = JSON.parse(inputText);
                output.value = JSON.stringify(parsed);
                showSuccess('JSON minified successfully!');
            } catch (e) {
                showError(`Invalid JSON: ${e.message}`);
                output.value = '';
            }
        }

        async function copyToClipboard() {
            const outputText = output.value;

            if (!outputText) {
                showError('No output to copy');
                return;
            }

            try {
                await navigator.clipboard.writeText(outputText);
                showSuccess('Copied to clipboard!');
            } catch (e) {
                showError('Failed to copy to clipboard');
            }
        }

        function clearAll() {
            input.value = '';
            output.value = '';
            localStorage.removeItem('json-formatter-input');
            hideMessages();
        }

        // Format on Ctrl/Cmd + Enter
        input.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                formatJSON();
            }
        });
    </script>
</body>
</html>
